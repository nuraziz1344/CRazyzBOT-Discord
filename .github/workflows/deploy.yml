name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and connect to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAILSCALE_AUTH_KEY}" ]; then
            echo "Error: TAILSCALE_AUTH_KEY secret is not set" >&2
            exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled
          sudo tailscale up --auth-key="${TAILSCALE_AUTH_KEY}" --hostname="gha-crazyzbot-${{ github.run_id }}" --timeout=30s
          tailscale ip -4

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for var in SSH_HOST SSH_USERNAME SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!var:-}" ]; then
              echo "Error: ${var} secret is not set" >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_PORT="${SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15)

          ssh "${SSH_OPTS[@]}" "${SSH_USERNAME}@${SSH_HOST}" \
            "bash -c 'dir=\"\${1/#\\~/\$HOME}\"; mkdir -p \"\$dir\" && cat > \"\$dir/docker-compose.yml\"' -- $(printf '%q' "$DEPLOY_PATH")" \
            < docker-compose.yml

          {
            printf 'GHCR_USER=%q\n' "$GHCR_USER"
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            cat << 'EOF'
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_PATH/#\~/$HOME}"
          cd "$DEPLOY_DIR"

          if [ ! -f .env ]; then
            echo "Error: .env file not found in $DEPLOY_DIR" >&2
            exit 1
          fi

          if [ ! -e cookies.txt ]; then
            touch cookies.txt
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF
          } | ssh "${SSH_OPTS[@]}" "${SSH_USERNAME}@${SSH_HOST}" "bash -s"

      - name: Disconnect from Tailscale
        if: always()
        run: |
          sudo tailscale logout || true
          rm -f ~/.ssh/deploy_key
